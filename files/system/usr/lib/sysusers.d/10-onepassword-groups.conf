# Pin the gids for 1Password's system groups so image and target agree
# numerically.
#
# The 1password / 1password-cli RPMs create these groups via a
# postinstall `groupadd` without `-g`, which picks a dynamic gid.
# rpm-ostree translates the groupadd into `30-rpmostree-pkg-group-*.conf`
# with a `-` (dynamic) gid, so the target picks whatever's free at first
# boot — different from what the container build assigned. The mismatch
# breaks setgid-based attestation on /usr/bin/op (see also
# pin-onepassword-gids.sh, which pins the same gids during image build).
#
# systemd-sysusers processes .conf files in filename order, so this
# `10-*` file runs before rpm-ostree's `30-*` files and pins the gid;
# the later files then find the group already exists and skip.
g onepassword     943
g onepassword-cli 945
g onepassword-mcp 944
